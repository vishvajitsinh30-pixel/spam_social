<!DOCTYPE html>
<html>
<head>
    <title>Tiny Spam Detector</title>
    <style>
        body { 
            font-family: Arial, sans-serif; 
            text-align: center; 
            margin-top: 50px; 
            background-color: #f4f4f9;
        }
        .container {
            background: white;
            padding: 30px;
            border-radius: 10px;
            box-shadow: 0px 0px 10px rgba(0,0,0,0.1);
            display: inline-block;
        }
        textarea { 
            width: 300px; 
            height: 100px; 
            padding: 10px; 
            margin-bottom: 15px;
        }
        button { 
            padding: 10px 20px; 
            background-color: #007bff; 
            color: white; 
            border: none; 
            border-radius: 5px; 
            cursor: pointer; 
        }
        button:hover { background-color: #0056b3; }
        .result { 
            margin-top: 20px; 
            font-size: 20px; 
            font-weight: bold; 
        }
    </style>
</head>
<body>
    <div class="container">
        <h2>Social Media Spam Detector</h2>
        
        <!-- The form sends the data to our Python backend -->
        <form method="POST">
            <textarea name="message" placeholder="Type a comment or post here..." required></textarea><br>
            <button type="submit">Check for Spam</button>
        </form>

        <!-- This displays the result sent back from Python -->
        {% if result %}
            <div class="result">{{ result }}</div>
        {% endif %}
    </div>
</body>
</html>
